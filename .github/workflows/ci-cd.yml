name: Analytics Platform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  node-monorepo:
    name: Node.js monorepo (core-backend & frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies (workspaces)
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate --schema core-backend/prisma/schema.prisma
      - name: Core Backend typecheck & build
        run: npm -w core-backend run build
      - name: Core Backend lint
        run: npm -w core-backend run lint
      - name: Core Backend tests
        run: npm -w core-backend test
      - name: Frontend typecheck
        run: npm -w frontend run typecheck
      - name: Frontend lint
        run: npm -w frontend run lint
      - name: Frontend production build
        run: npm -w frontend run build

  python-services:
    name: Python Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data-engine, presentation-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
      - name: Syntax Check
        run: |
          cd ${{ matrix.service }}
          python -m py_compile main.py
          if [ -d tests ]; then python -m unittest discover -s tests; fi