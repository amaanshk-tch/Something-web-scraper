name: Analytics Platform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Core Backend (Node.js & Prisma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core-backend/package-lock.json
      - name: Install dependencies
        run: |
          cd core-backend
          npm ci
      - name: Generate Prisma Client
        run: |
          cd core-backend
          npx prisma generate
      - name: Build TypeScript
        run: |
          cd core-backend
          npm run build

  frontend-test:
    name: Frontend (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build

  python-services:
    name: Python Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data-engine, presentation-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
      - name: Syntax Check
        run: |
          cd ${{ matrix.service }}
          python -m py_compile main.py
          if [ -d tests ]; then python -m unittest discover -s tests; fi